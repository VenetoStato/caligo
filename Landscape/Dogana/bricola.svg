<svg xmlns="http://www.w3.org/2000/svg" width="150" height="500" viewBox="0 0 150 500">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#9c7752"/><stop offset=".4" stop-color="#6a4e35"/>
      <stop offset=".76" stop-color="#3b2c20"/><stop offset="1" stop-color="#221913"/>
    </linearGradient>
    <linearGradient id="soak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1c1e" stop-opacity="0"/>
      <stop offset=".1" stop-color="#12312f" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#0b2426" stop-opacity=".8"/>
      <stop offset="1" stop-color="#04100f" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="algae" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#54703e" stop-opacity=".9"/><stop offset="1" stop-color="#22381f" stop-opacity=".15"/>
    </linearGradient>
  </defs>

  <!-- fascio di tre pali legati in alto e aperti verso il fondale -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#150f0c" stroke-width="20">
      <path d="M46 496L60 32"/><path d="M75 498V14"/><path d="M104 496L90 26"/>
    </g>
    <g stroke="url(#wood)" stroke-width="15">
      <path d="M46 496L60 32"/><path d="M75 498V14"/><path d="M104 496L90 26"/>
    </g>
  </g>

  <!-- venature verticali -->
  <g stroke="#1b120d" stroke-width="1.5" opacity=".45" fill="none">
    <path d="M57 44L44 470"/><path d="M74 26V476"/><path d="M91 40L103 470"/>
  </g>
  <g stroke="#c19a6b" stroke-width="1.4" opacity=".28" fill="none">
    <path d="M64 40L52 464"/><path d="M79 26V470"/><path d="M86 38L97 464"/>
  </g>

  <!-- teste tagliate a sbieco, sbiancate dal sale -->
  <g fill="#d3cbb5" opacity=".7">
    <ellipse cx="60" cy="32" rx="7" ry="3.6" transform="rotate(-8 60 32)"/>
    <ellipse cx="75" cy="14" rx="7.4" ry="3.8"/>
    <ellipse cx="90" cy="26" rx="7" ry="3.6" transform="rotate(8 90 26)"/>
  </g>

  <!-- legatura di corda avvolta attorno al fascio -->
  <g fill="none" stroke="#151210" stroke-width="4.5" opacity=".85">
    <path d="M53 52c14 5 30 4 44-2"/><path d="M53 60c14 5 30 4 44-2"/><path d="M54 68c13 5 29 4 42-2"/>
  </g>
  <g fill="none" stroke="#b39468" stroke-width="2.6" opacity=".85">
    <path d="M53 51c14 5 30 4 44-2"/><path d="M53 59c14 5 30 4 44-2"/><path d="M54 67c13 5 29 4 42-2"/>
  </g>
  <path d="M96 62l9 8-11-1" fill="none" stroke="#a98c62" stroke-width="2.4" opacity=".8"/>

  <!-- cerchiatura di ferro -->
  <path d="M51 100c15 6 32 5 48-2" fill="none" stroke="#100f0e" stroke-width="6" opacity=".85"/>
  <path d="M51 98c15 6 32 5 48-2" fill="none" stroke="#7c7972" stroke-width="3" opacity=".85"/>

  <!-- fascia di marea: alghe e umido sul bagnasciuga.
       Segue la sagoma del fascio: un rettangolo pieno leggerebbe come una
       scatola incollata sopra i pali. -->
  <path d="M47 120L103 120L105 160L45 160Z" fill="url(#algae)"/>
  <g fill="none" stroke="#3f5c33" stroke-width="3.4" opacity=".72" stroke-linecap="round">
    <path d="M48 150c0 12-2 18-4 26"/><path d="M62 154c1 10-1 16-2 22"/>
    <path d="M75 156v26"/><path d="M89 154c-1 10 1 16 2 22"/><path d="M102 150c0 12 2 18 4 26"/>
  </g>
  <path d="M36 128c14-6 28 5 42 0 13-5 22 4 32 0" fill="none" stroke="#84aca4" stroke-width="2.6" opacity=".5"/>

  <!-- parte sommersa: si allarga come i pali che si aprono verso il fondale -->
  <path d="M47 126L103 126L114 500L36 500Z" fill="url(#soak)"/>
  <g fill="#9fb0a4" opacity=".3">
    <circle cx="56" cy="220" r="3.6"/><circle cx="96" cy="272" r="4"/><circle cx="70" cy="330" r="3"/>
    <circle cx="58" cy="392" r="3.4"/><circle cx="99" cy="430" r="2.8"/><circle cx="78" cy="466" r="3.2"/>
  </g>
  <ellipse cx="75" cy="494" rx="52" ry="8" fill="#04100f" opacity=".8"/>
</svg>
